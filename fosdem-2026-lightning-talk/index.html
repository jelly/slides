# Sharing your pacman cache on the LAN

#### Jelle van der Waa [&lt;jelle@archlinux.org&gt;](mailto:jelle@archlinux.org)

---

# CacheServer

* Introduced in pacman 6.1.0
* Not used for pacman database files
* Not removed when a package cannot be found (HTTP 404)

---

# Requirements

* An Arch server / container / virtual machine on your LAN
* A HTTP(S) server
* systemd timer

---

# HTTP(S) server

```
python -m http.server -d /var/cache/pacman/pkg/
```

---

# Client configuration

```
head -n 1 /etc/pacman.d/mirrorlist
CacheServer = http://server-ip:port
```

---

# Timer

```
# /etc/systemd/system/pacman-cache.timer
[Unit]
Description=Daily pacman cache timer

[Timer]
OnCalendar=daily
Persistent=true

[Install]
WantedBy=timers.target
```

---

# Unit

Requires `pacman-contrib` and `fakeroot`

```
# /etc/systemd/system/pacman-cache.service
[Unit]
Description=pacman cache download service

[Service]
Type=oneshot
ExecStart=/usr/bin/checkupdates -d
```
